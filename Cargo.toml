[package]
name = "ferret"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local-first semantic multimodal file search"
license = "MIT"
default-run = "ferret"

[dependencies]
thiserror = "2"
dirs = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
